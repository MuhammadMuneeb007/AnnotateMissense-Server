[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "annotatemissense"
version = "1.1.0"
description = "Lookup, VCF annotation, REST API and web server for AnnotateMissense GRCh38 missense pathogenicity predictions"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Muhammad Muneeb" }, { name = "David B. Ascher" }]
dependencies = ["duckdb>=1.4.3,<2"]

[project.optional-dependencies]
server = ["flask>=3.0,<4", "flask-cors>=4.0", "flask-limiter>=3.7", "waitress>=3.0"]
dev = ["pytest>=8"]

[project.scripts]
annotatemissense = "annotatemissense.cli:main"

[project.urls]
Documentation = "https://muhammadmuneeb007.github.io/AnnotateMissense/"
Pipeline = "https://github.com/MuhammadMuneeb007/AnnotateMissense"
Data = "https://doi.org/10.5281/zenodo.19981867"

[tool.setuptools]
packages = ["annotatemissense", "app"]
include-package-data = true

[tool.setuptools.package-data]
app = ["templates/*.html", "static/css/*", "static/js/*", "static/samples/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
